[project]
name = "cs2wp-pipeline"
version = "0.1.0"
description = "cs2wp workers: HLTV downloader, ingest, parse, features, score, Kalshi, job worker, live runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cs2wp-core[all]",  # S3, Postgres and Kafka drivers: services run in lite and stack mode
    "demoparser2>=0.42",
    "certifi>=2024.2",
    "curl-cffi>=0.7",  # HLTV downloader: Chrome-like client (plain HTTP clients get a Cloudflare challenge)
]

[project.scripts]
cs2wp-pipeline = "cs2wp_pipeline:main"

[tool.uv.sources]
cs2wp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs2wp_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
