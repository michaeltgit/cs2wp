name: python
# core, pipeline, ml, api: one uv workspace, lint once, test each package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [core/**, pipeline/**, ml/**, api/**, pyproject.toml, uv.lock, .python-version, infra/docker/python.Dockerfile, .github/workflows/python.yml]
  pull_request:
    paths: [core/**, pipeline/**, ml/**, api/**, pyproject.toml, uv.lock, .python-version, infra/docker/python.Dockerfile, .github/workflows/python.yml]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, pipeline, ml, api]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Archive extractors
        if: matrix.package == 'pipeline'
        run: sudo apt-get update -q && sudo apt-get install -y -q unar
      - run: uv sync --all-packages --frozen
      - run: uv run pytest -q
        working-directory: ${{ matrix.package }}

  image:
    # One image for every Python service (api, pipeline worker, runtime, ml worker) -> GHCR
    if: github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/python.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
