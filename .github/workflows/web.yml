name: web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/web.yml]
  pull_request:
    paths: [web/**, .github/workflows/web.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      # Deploy (once AWS exists): aws s3 sync dist/ s3://cs2wp-web-assets --delete
      # then a CloudFront invalidation. Not wired up: nothing is applied to AWS yet.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist
          if-no-files-found: error
          retention-days: 14
