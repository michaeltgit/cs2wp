# The website in Docker: serves the build and proxies /api and /ws to the api container.
# On AWS, CloudFront does the same split (S3 for the site, the API host for /api and /ws).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's DNS; re-resolve the api container when it is recreated
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8000;

  location /api/ { proxy_pass $api; proxy_read_timeout 300s; }
  location /ws/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # hashed build assets never change; the entry point always revalidates
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
